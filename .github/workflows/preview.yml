name: Preview build (not deployed)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test
      # PREVIEW=true: no login, nothing saved. This build is only an artifact, never published.
      - run: flutter build web --release --dart-define=PREVIEW=true --base-href /
      - uses: actions/upload-artifact@v4
        with:
          name: preview-web
          path: build/web
          retention-days: 7
